name: Build Installer

on:
  push:
    branches: [ "main" ]
    tags:
      - "*.*.*"
  pull_request:
    branches: [ "main" ]

jobs:
  build-starter:
    name: Build Starter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86, win-arm64, linux-x64, linux-arm, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Starter
        run: dotnet publish --configuration Release --self-contained --runtime ${{ matrix.rid }} -o ../../build
        working-directory: src/Starter

      - name: Build Apps plugin
        working-directory: src/Starter.ApplicationSearchEngine
        run: |
          FRAMEWORK="net9.0"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
          FRAMEWORK="net9.0-windows10.0.19041.0"
          fi
          dotnet publish --configuration Release --runtime ${{ matrix.rid }} --framework $FRAMEWORK -p:EnableWindowsTargeting=true -o ../../build/Plugins/ApplicationSearchEngine

      - name: Build Url plugin
        run: dotnet publish --configuration Release --runtime ${{ matrix.rid }} -o ../../build/Plugins/UrlSearchEngine
        working-directory: src/Starter.UrlSearchEngine

      - name: Build Web plugin
        run: dotnet publish --configuration Release --runtime ${{ matrix.rid }} -o ../../build/Plugins/WebSearchEngine
        working-directory: src/Starter.WebSearchEngine

      - name: Build Workspace plugin
        run: dotnet publish --configuration Release --runtime ${{ matrix.rid }} -o ../../build/Plugins/WorkspaceSearcheEngine
        working-directory: src/Starter.WorkspaceSearchEngine

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starter-build-${{ matrix.rid }}
          path: build

  build-windows-installer:
    name: Build the Windows installer
    needs: build-starter
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download Starter build
        uses: actions/download-artifact@v4
        with:
          name: starter-build-${{ matrix.rid }}
          path: src/Starter/build

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: src/Starter.Installer/starter-setup.iss
          options: /O+ /F"starter-installer-${{ matrix.rid }}" /DAppVersion=${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starter-installer-${{ matrix.rid }}
          path: src/Starter.Installer/starter-installer-${{ matrix.rid }}.exe

  create-release:
    name: Create release
    needs: [build-starter, build-windows-installer]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: zip -r starter-portable-win-x64.zip ./*
        working-directory: artifacts/starter-build-win-x64
      - run: zip -r starter-portable-win-x86.zip ./*
        working-directory: artifacts/starter-build-win-x86
      - run: zip -r starter-portable-win-arm64.zip ./*
        working-directory: artifacts/starter-build-win-arm64
      - run: zip -r starter-portable-linux-x64.zip ./*
        working-directory: artifacts/starter-build-linux-x64
      - run: zip -r starter-portable-linux-arm.zip ./*
        working-directory: artifacts/starter-build-linux-arm
      - run: zip -r starter-portable-linux-arm64.zip ./*
        working-directory: artifacts/starter-build-linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          files: |
            artifacts/starter-build-*/starter-portable-*.zip
            artifacts/starter-installer-*/starter-installer-*.exe
